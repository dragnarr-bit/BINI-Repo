<!DOCTYPE html>
<html lang="en">
  <head>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Latest compiled and minified CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
      integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu"
      crossorigin="anonymous"
    />
    <!-- Optional theme -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap-theme.min.css"
      integrity="sha384-6pzBo3FDv/PJ8r2KRkGHifhEocL+1X2rVCTTkUfGk7/0pbek5mMa1upzvWbrUbOZ"
      crossorigin="anonymous"
    />
    <!-- Latest compiled and minified JavaScript -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"
      integrity="sha384-aJ21OjlMXNL5UyIl/XNwTMqvzeRMZH2w8c5cRVpzpU8Y5bApTppSuUkhZXN0VxHd"
      crossorigin="anonymous"
    ></script>
    
    <title>Responsive Page</title>
    <style>
      body {
        background-color: white; /* Set background color to white */
      }

      .banner {
        background-color: #ffe0e8; /* Banner color */
        padding: 0px;
        text-align: center;
      }

      .banner h2 {
        margin: 0; /* Remove default margin */
        padding: 10px;
        font-family: "DM Sans", Arial, Helvetica, sans-serif;
        color: #5d2b37;
        font-size: 14px;
        font-weight: 500px;
        line-height: 21px;
        text-align: center;
        display: block;
      }

      .logo {
        max-width: 100%; /* Ensure the logo is responsive */
        height: auto; /* Maintain aspect ratio */
        display: block; /* Center the image */
        margin: 0 auto; /* Center the image */
        width: 300px; /* Width of the logo */
        height: 100%;
        padding: auto;
      }

      @media (max-width: 1920px) {
        .back-button,
        .cart-button {
          display: none; /* Hide the banner on mobile screens */
        }
      } 
      @media (max-width: 320px) {
        .banner {
          display: none; /* Hide the banner on mobile screens */
        }
        .logo {
          width: 91px; /* Adjust the width of the logo on mobile screens */
          height: 23px;

          display: block; /* Center the image */
          margin: 0 auto; /* Center the image */
          /* margin-top: 10px; */
        }

        .back-button, .cart-button {
          width: 24px;
          height: 24px;
          display: contents;
        }
        .header1 {
          display: flex;
          justify-content: center;
          margin-top: 10px;
          color: #000;
        }
        .contanier-product {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-top: 10px;
            margin-left: -30px;
        }
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <h2>
        Handcrafted crochet flowers that last forever.
        <strong>Buy 2, Get 1 Free!</strong> Custom bouquets available!
        <strong>Order now!</strong>
      </h2>
    </div>

    <div class="container text-center">
      <div class="row header1">
        <div class="col-xs-3 col-md-4 back-arrow">
          <a href="javascript:window.history.back();" class="back-button">
            <img src="{{cdn 'assets/img/back1.svg'}}" alt="Back" />
          </a>
        </div>
        <div class="col-xs-6 col-md-4">
          <a href="{{urls.home}}">
            <img src="{{cdn 'assets/img/LogoMark.svg'}}" alt="Logo" class="logo" />
          </a>
        </div>
        <div class="col-xs-3 col-md-4">
          <a href="{{urls.cart}}" class="cart-button">
            <img src="{{cdn 'assets/img/cart-1.svg'}}" alt="cart" />
          </a>
        </div>
      </div>

   


    
  </body>
 
</html>
